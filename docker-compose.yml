version: '3.8'

services:
  recommendation-service:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: rec-service
    ports:
      - "8000:8000"
    volumes:
      # Для разработки монтируем код
      - ./service:/app
      - ./models:/models
      - ./data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3